name: V2 Quality Checks
on:
  push:
    branches: [dev/cinematic-v2]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/portfolio_ci
          DIRECT_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/portfolio_ci
          AUTH_SECRET: ci-only-placeholder-32-characters-not-a-real-secret
          GITHUB_OWNER_ID: '227576165'
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_GITHUB_ID: ci-placeholder
          AUTH_GITHUB_SECRET: ci-placeholder
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          CLOUDINARY_UPLOAD_FOLDER: ci-portfoliov2
